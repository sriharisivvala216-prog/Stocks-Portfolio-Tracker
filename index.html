<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portfolio Tracker</title>
  <link rel="stylesheet" href="login.css">
  <link rel="icon" href="stockMarket.webp">
  <link href="https://cdn.jsdelivr.net/npm/libertinus-font@1.0.0/webfonts/libertinus.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="card" data-tilt data-tilt-max="15" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2" style="transform-style: preserve-3d;">
      <h1 class="logo" style="transform: translateZ(40px);">Portfolio Tracker</h1>
      <form id="loginForm" class="form">
        <input type="text" id="username" placeholder="Email or Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn">Log in</button>
      </form>

      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <div class="card switch" data-tilt data-tilt-max="10" data-tilt-speed="400" style="transform-style: preserve-3d;">
      <p style="transform: translateZ(20px);">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>
  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script>
    VanillaTilt.init(document.querySelectorAll(".card"));
  </script>
</body>
</html>
